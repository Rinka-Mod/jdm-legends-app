    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e01f2d'/%3E%3C/svg%3E"
    />

  <body>
    <!-- ============================================================
         PRELOADER — giữ nguyên như bản tĩnh gốc.
         Đặt thẳng trong HTML (không qua React) để hiện ngay ở khung hình
         đầu tiên; script bên dưới chạy lúc parse nên không có màn hình
         trắng lóe lên trước khi hiệu ứng tải xuất hiện.
         ============================================================ -->
    <div class="preloader" id="preloader">
      <div class="preloader__sun"></div>
      <div class="preloader__inner">
        <span class="preloader__jp">読み込み中</span>
        <span class="preloader__en">JDM LEGENDS</span>
        <div class="preloader__bar"><i id="preBar"></i></div>
        <span class="preloader__pct" id="prePct">0%</span>

        <!-- Tên tác giả hiện ngay dưới hiệu ứng tải -->
        <p class="preloader__credit">
          <span>Thiết kế &amp; phát triển bởi</span>
          <b>Rinka-Mod</b>
        </p>
      </div>
    </div>

    <div id="root"></div>

    <!-- ============================================================
         Script chạy ngay lúc parse (không defer) — tương đương việc bản
         tĩnh gốc đặt main.js ở cuối <body>. Nhiệm vụ:
           • khoá cuộn nền trong lúc tải
           • chạy thanh tiến trình, thêm .is-complete khi đầy
           • mở trang: thêm body.is-ready + bắn sự kiện "site:ready"
             để React bắt đầu đếm số liệu ở hero
         ============================================================ -->
    <script>
      (function () {
        var preloader = document.getElementById("preloader");
        var bar = document.getElementById("preBar");
        var pct = document.getElementById("prePct");
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // Thanh chạy xong -> giữ tên tác giả đứng thêm 0.6s rồi mới mở trang
        var PRELOAD_FADE = 420;
        var CREDIT_HOLD = 600;
        var finished = false;

        function finishPreload() {
          if (finished) return;
          finished = true;
          preloader.classList.add("is-done");
          document.body.classList.remove("is-locked");
          document.body.classList.add("is-ready");
          document.dispatchEvent(new CustomEvent("site:ready"));
        }

        if (reduced) {
          finishPreload();
          return;
        }

        document.body.classList.add("is-locked");
        var progress = 0;
        var timer = setInterval(function () {
          progress = Math.min(100, progress + Math.random() * 16 + 6);
          bar.style.width = progress + "%";
          pct.textContent = Math.round(progress) + "%";
          if (progress >= 100) {
            clearInterval(timer);
            // Nhấn nhẹ tên tác giả khi thanh vừa chạy xong
            preloader.classList.add("is-complete");
            setTimeout(finishPreload, PRELOAD_FADE + CREDIT_HOLD);
          }
        }, 130);
        // Chốt an toàn: không giữ người dùng quá 4.2s
        setTimeout(finishPreload, 4200);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
